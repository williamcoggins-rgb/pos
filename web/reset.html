<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset POS Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1a1a1a;
        }
        p {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn {
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 8px;
        }
        .btn-danger {
            background: #DC2626;
            color: white;
        }
        .btn-danger:hover {
            background: #B91C1C;
        }
        .btn-secondary {
            background: #E5E5E5;
            color: #1a1a1a;
        }
        .btn-secondary:hover {
            background: #D4D4D4;
        }
        .success {
            background: #00C853;
            color: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .data-list {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        .data-item {
            padding: 8px 0;
            border-bottom: 1px solid #E5E5E5;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .data-item:last-child {
            border-bottom: none;
        }
        .data-label {
            font-weight: 600;
        }
        .data-value {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset POS Data</h1>

        <div id="successMessage" class="success">
            ✅ All data has been cleared! Redirecting to home...
        </div>

        <div id="dataDisplay">
            <p>This will permanently delete all your POS data:</p>

            <div class="data-list" id="dataList">
                <div class="data-item">
                    <span class="data-label">User Profile:</span>
                    <span class="data-value" id="profileStatus">-</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Passcode:</span>
                    <span class="data-value" id="passcodeStatus">-</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Transactions:</span>
                    <span class="data-value" id="transactionsStatus">-</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Services:</span>
                    <span class="data-value" id="servicesStatus">-</span>
                </div>
            </div>

            <div>
                <button class="btn btn-danger" onclick="resetAllData()">Clear All Data</button>
                <button class="btn btn-secondary" onclick="goHome()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Check what data exists
        function checkData() {
            const userProfile = localStorage.getItem('userProfile');
            const passcode = localStorage.getItem('passcode');
            const transactions = localStorage.getItem('transactions');
            const services = localStorage.getItem('services');

            document.getElementById('profileStatus').textContent = userProfile ? 'Exists' : 'None';
            document.getElementById('passcodeStatus').textContent = passcode ? 'Set' : 'None';

            if (transactions) {
                const count = JSON.parse(transactions).length;
                document.getElementById('transactionsStatus').textContent = count + ' transaction(s)';
            } else {
                document.getElementById('transactionsStatus').textContent = 'None';
            }

            if (services) {
                const count = JSON.parse(services).length;
                document.getElementById('servicesStatus').textContent = count + ' service(s)';
            } else {
                document.getElementById('servicesStatus').textContent = 'None';
            }
        }

        function resetAllData() {
            if (confirm('Are you sure? This cannot be undone.')) {
                // Clear all POS data
                localStorage.removeItem('userProfile');
                localStorage.removeItem('passcode');
                localStorage.removeItem('transactions');
                localStorage.removeItem('services');
                localStorage.removeItem('profile');
                localStorage.removeItem('cart');

                // Show success message
                document.getElementById('dataDisplay').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';

                // Redirect to home after 2 seconds
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            }
        }

        function goHome() {
            window.location.href = '/';
        }

        // Check data on load
        checkData();
    </script>
</body>
</html>
