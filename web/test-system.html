<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Test - BarberScore POS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .test-item {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #999;
        }

        .test-item.testing {
            border-left-color: #ff9800;
        }

        .test-item.success {
            border-left-color: #4CAF50;
            background: #e8f5e9;
        }

        .test-item.error {
            border-left-color: #f44336;
            background: #ffebee;
        }

        .test-item h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .test-item p {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .test-item code {
            background: rgba(0,0,0,0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .summary {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            text-align: center;
        }

        .summary h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 System Test</h1>
        <p class="subtitle">Testing your BarberScore POS backend and Stripe integration</p>

        <button onclick="runTests()" id="testBtn">
            <span id="btnText">Run All Tests</span>
        </button>

        <div id="tests" style="margin-top: 30px;"></div>
        <div id="summary" style="display: none;"></div>
    </div>

    <script>
        const API_URL = 'https://pos-production-fd37.up.railway.app';

        const tests = [
            {
                name: 'Backend Health Check',
                description: 'Checking if backend server is running',
                test: async () => {
                    const response = await fetch(`${API_URL}/health`);
                    const data = await response.json();
                    if (data.status === 'healthy') {
                        return { success: true, message: 'Backend is healthy and database is connected' };
                    }
                    throw new Error('Backend unhealthy');
                }
            },
            {
                name: 'Stripe Fields Migration',
                description: 'Checking if Stripe fields exist in database',
                test: async () => {
                    const response = await fetch(`${API_URL}/add-stripe-fields`);
                    const text = await response.text();
                    if (text.includes('✅') || text.includes('already exist')) {
                        return { success: true, message: 'Stripe fields are in the database' };
                    }
                    throw new Error('Stripe fields missing');
                }
            },
            {
                name: 'Stripe API Configuration',
                description: 'Checking if Stripe keys are configured',
                test: async () => {
                    // Try to create a test registration
                    const response = await fetch(`${API_URL}/api/stripe/account-status`, {
                        method: 'GET',
                        headers: {
                            'Authorization': 'Bearer invalid-token-for-test'
                        }
                    });

                    // If we get 401, that means the endpoint exists and is working
                    // If we get 500 with "Stripe not configured", that means keys are missing
                    if (response.status === 401) {
                        return { success: true, message: 'Stripe endpoints are configured (auth required to test fully)' };
                    } else if (response.status === 500) {
                        const data = await response.json();
                        if (data.error && data.error.includes('not configured')) {
                            throw new Error('Stripe keys not added to Railway yet');
                        }
                    }
                    return { success: true, message: 'Stripe API ready' };
                }
            },
            {
                name: 'Payment Routes',
                description: 'Checking if payment endpoints are available',
                test: async () => {
                    const response = await fetch(`${API_URL}/api/payments/create-payment-intent`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer invalid-token'
                        },
                        body: JSON.stringify({ amount: 10 })
                    });

                    // 401 means endpoint exists and requires auth (good!)
                    if (response.status === 401) {
                        return { success: true, message: 'Payment routes are active' };
                    }
                    throw new Error('Payment routes not found');
                }
            },
            {
                name: 'Frontend Deployment',
                description: 'Checking if frontend is deployed on Vercel',
                test: async () => {
                    const response = await fetch('https://pos-ivrc.vercel.app/register.html');
                    if (response.ok) {
                        return { success: true, message: 'Registration page is live' };
                    }
                    throw new Error('Frontend not accessible');
                }
            }
        ];

        async function runTests() {
            const btn = document.getElementById('testBtn');
            const btnText = document.getElementById('btnText');
            const testsDiv = document.getElementById('tests');
            const summaryDiv = document.getElementById('summary');

            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span>Running tests...';
            testsDiv.innerHTML = '';
            summaryDiv.style.display = 'none';

            let passed = 0;
            let failed = 0;

            for (const testCase of tests) {
                const testDiv = document.createElement('div');
                testDiv.className = 'test-item testing';
                testDiv.innerHTML = `
                    <h3><span class="status-icon">⏳</span>${testCase.name}</h3>
                    <p>${testCase.description}</p>
                    <p><small>Testing...</small></p>
                `;
                testsDiv.appendChild(testDiv);

                try {
                    const result = await testCase.test();
                    testDiv.className = 'test-item success';
                    testDiv.innerHTML = `
                        <h3><span class="status-icon">✅</span>${testCase.name}</h3>
                        <p>${testCase.description}</p>
                        <p><strong>Result:</strong> ${result.message}</p>
                    `;
                    passed++;
                } catch (error) {
                    testDiv.className = 'test-item error';
                    testDiv.innerHTML = `
                        <h3><span class="status-icon">❌</span>${testCase.name}</h3>
                        <p>${testCase.description}</p>
                        <p><strong>Error:</strong> ${error.message}</p>
                    `;
                    failed++;
                }

                await new Promise(resolve => setTimeout(resolve, 500));
            }

            btn.disabled = false;
            btnText.textContent = 'Run Tests Again';

            summaryDiv.style.display = 'block';
            if (failed === 0) {
                summaryDiv.className = 'summary';
                summaryDiv.innerHTML = `
                    <h2>🎉 All Tests Passed!</h2>
                    <p>Your system is fully operational and ready to accept payments.</p>
                    <p style="margin-top: 10px;"><strong>${passed}/${tests.length}</strong> tests passed</p>
                `;
            } else {
                summaryDiv.className = 'summary';
                summaryDiv.style.background = 'linear-gradient(135deg, #f44336 0%, #e91e63 100%)';
                summaryDiv.innerHTML = `
                    <h2>⚠️ Some Tests Failed</h2>
                    <p><strong>${passed}</strong> passed, <strong>${failed}</strong> failed</p>
                    <p style="margin-top: 10px;">Check the errors above and fix the issues.</p>
                `;
            }
        }

        // Auto-run tests on page load
        setTimeout(() => {
            runTests();
        }, 500);
    </script>
</body>
</html>
