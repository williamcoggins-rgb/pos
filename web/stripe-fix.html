<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Stripe Setup</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; margin-bottom: 20px; }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .btn:hover { background: #5568d3; }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        .info {
            background: #fef3c7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Fix Stripe Setup</h1>

        <div class="info">
            <strong>What this does:</strong><br>
            This will clear any broken Stripe account data from your profile, allowing you to start fresh with Stripe setup.
        </div>

        <button class="btn" onclick="fixStripeSetup()" id="fixBtn">
            Clear Stripe Data & Start Fresh
        </button>

        <div id="message" class="message"></div>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center;">
            <a href="pos-v4.html" style="color: #667eea; text-decoration: none;">← Back to POS</a>
        </div>
    </div>

    <script>
        async function fixStripeSetup() {
            const btn = document.getElementById('fixBtn');
            const message = document.getElementById('message');

            btn.disabled = true;
            btn.textContent = 'Clearing data...';
            message.className = 'message';
            message.style.display = 'none';

            try {
                const token = localStorage.getItem('auth_token');

                if (!token) {
                    throw new Error('Not logged in. Please log in first.');
                }

                // Call backend to clear Stripe data
                const response = await fetch('https://pos-production-fd37.up.railway.app/api/stripe/reset-account', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || data.error || 'Failed to reset account');
                }

                message.className = 'message success';
                message.textContent = '✅ Stripe data cleared successfully! Redirecting to POS...';

                setTimeout(() => {
                    window.location.href = 'pos-v4.html#settings';
                }, 2000);

            } catch (error) {
                console.error('Fix error:', error);
                message.className = 'message error';
                message.textContent = `❌ Error: ${error.message}`;
                btn.disabled = false;
                btn.textContent = 'Clear Stripe Data & Start Fresh';
            }
        }
    </script>
</body>
</html>
