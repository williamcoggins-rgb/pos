<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- Version: 2.0.0 - Direct Stripe onboarding after registration -->
    <title>Register - BarberScore POS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .message.success {
            background: #e8f5e9;
            border-left: 4px solid #4CAF50;
            color: #2E7D32;
        }

        .message.error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }

        .next-step {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 12px;
            display: none;
        }

        .next-step h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .next-step p {
            color: #555;
            line-height: 1.6;
        }

        .next-step a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .next-step a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏪 Create Your Account</h1>
        <p class="subtitle">Set up your BarberScore POS account and shop</p>

        <form id="registerForm" onsubmit="register(event)">
            <div class="form-group">
                <label for="shopName">Shop Name *</label>
                <input type="text" id="shopName" required placeholder="e.g., The Barber Lounge">
            </div>

            <div class="form-group">
                <label for="ownerName">Your Name *</label>
                <input type="text" id="ownerName" required placeholder="e.g., John Smith">
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" required minlength="8" placeholder="At least 8 characters">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="(555) 123-4567">
            </div>

            <button type="submit" id="registerBtn">Create Account</button>
        </form>

        <div id="message" class="message"></div>

        <div id="nextStep" class="next-step">
            <h3>✅ Account Created!</h3>
            <p><strong>Setting up payment processing...</strong></p>
            <p id="stripeStatus" style="margin-top: 10px; color: #666;">
                Connecting to Stripe...
            </p>
            <div id="stripeError" style="display: none; margin-top: 15px;">
                <p style="color: #c62828; margin-bottom: 10px;">Could not start Stripe setup automatically.</p>
                <a href="login.html" style="display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600;">
                    Continue to Login →
                </a>
                <p style="margin-top: 10px; font-size: 13px; color: #666;">
                    You can set up payment processing in Settings after logging in.
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://pos-production-fd37.up.railway.app/api';

        async function startStripeOnboarding(authToken) {
            const stripeStatus = document.getElementById('stripeStatus');
            const stripeError = document.getElementById('stripeError');

            try {
                stripeStatus.textContent = 'Creating your payment account...';

                const response = await fetch(`${API_URL}/stripe/create-account-link`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (response.ok && result.url) {
                    stripeStatus.textContent = 'Redirecting to Stripe...';
                    // Redirect to Stripe onboarding
                    window.location.href = result.url;
                } else if (result.already_onboarded) {
                    stripeStatus.textContent = 'Payment processing already set up!';
                    setTimeout(() => {
                        window.location.href = 'pos-v4.html';
                    }, 1500);
                } else {
                    throw new Error(result.detail || result.error || 'Failed to create Stripe account');
                }
            } catch (error) {
                console.error('Stripe setup error:', error);
                stripeStatus.style.display = 'none';
                stripeError.style.display = 'block';
            }
        }

        async function register(event) {
            event.preventDefault();

            const btn = document.getElementById('registerBtn');
            const message = document.getElementById('message');
            const nextStep = document.getElementById('nextStep');
            const stripeStatus = document.getElementById('stripeStatus');
            const stripeError = document.getElementById('stripeError');

            btn.disabled = true;
            btn.textContent = 'Creating Account...';
            message.style.display = 'none';
            nextStep.style.display = 'none';
            stripeError.style.display = 'none';

            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                shopName: document.getElementById('shopName').value,
                ownerName: document.getElementById('ownerName').value,
                phone: document.getElementById('phone').value || null
            };

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    message.className = 'message success';
                    message.textContent = `✅ Account created successfully! Welcome, ${data.ownerName}!`;
                    message.style.display = 'block';
                    nextStep.style.display = 'block';

                    // Store credentials
                    localStorage.setItem('migration_email', data.email);
                    localStorage.setItem('auth_token', result.access_token);

                    document.getElementById('registerForm').style.display = 'none';

                    // Immediately start Stripe onboarding
                    await startStripeOnboarding(result.access_token);
                } else {
                    throw new Error(result.message || result.error || 'Registration failed');
                }
            } catch (error) {
                message.className = 'message error';
                message.textContent = `❌ Error: ${error.message}`;
                message.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }
    </script>
</body>
</html>
