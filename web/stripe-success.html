<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Setup - BarberScore POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { color: #333; margin-bottom: 12px; font-size: 24px; }
        p { color: #666; line-height: 1.6; margin-bottom: 16px; font-size: 15px; }
        .status-box {
            padding: 16px;
            border-radius: 8px;
            margin: 24px 0;
            text-align: left;
            font-size: 14px;
        }
        .status-box.checking { background: #f5f5f5; color: #666; }
        .status-box.active { background: #e8f5e9; border-left: 4px solid #4CAF50; color: #2E7D32; }
        .status-box.pending { background: #fff3e0; border-left: 4px solid #FF9800; color: #E65100; }
        .status-box.incomplete { background: #fce4ec; border-left: 4px solid #f44336; color: #c62828; }
        button {
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #16213e; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid #ddd; border-top: 2px solid #666;
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-left: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon" id="icon">...</div>
        <h1 id="heading">Checking account status</h1>
        <p id="message">Verifying your Stripe connection...</p>

        <div id="statusBox" class="status-box checking">
            Contacting Stripe<span class="spinner"></span>
        </div>

        <button id="continueBtn" class="hidden" onclick="continueFlow()">Continue</button>
    </div>

    <script>
        // API base: same origin in production, override with window.API_BASE_URL if split
        var API_BASE = window.API_BASE_URL || window.location.origin;

        function getToken() {
            return localStorage.getItem('access_token') || '';
        }

        async function checkStatus() {
            var token = getToken();
            if (!token) {
                showState('incomplete', 'Not Logged In', 'Please log in first.', 'Go to Login', function() {
                    window.location.href = 'login.html';
                });
                return;
            }

            try {
                var resp = await fetch(API_BASE + '/api/stripe/account-status', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!resp.ok) throw new Error('API error: ' + resp.status);
                var data = await resp.json();

                if (data.status === 'active') {
                    showState('active', 'Account Verified',
                        'Your Stripe account is active. You can accept payments.',
                        'Continue', function() { window.location.href = 'index.html'; });
                } else if (data.status === 'pending_verification') {
                    showState('pending', 'Verification In Progress',
                        'Stripe is reviewing your details. This typically takes 1-2 business days. You can still set your PIN while you wait.',
                        'Set Your PIN', function() { window.location.href = 'index.html'; });
                } else if (data.status === 'pending_onboarding') {
                    showState('incomplete', 'Setup Incomplete',
                        'You started Stripe onboarding but did not finish. Click below to continue where you left off.',
                        'Resume Stripe Setup', resumeOnboarding);
                } else if (data.status === 'stale_account') {
                    showState('incomplete', 'Reconnect Required',
                        data.message || 'Your Stripe account needs to be reconnected.',
                        'Connect Stripe', resumeOnboarding);
                } else {
                    showState('incomplete', 'Connect Stripe',
                        'Connect your Stripe account to start accepting payments.',
                        'Connect Stripe', resumeOnboarding);
                }
            } catch (err) {
                console.error(err);
                showState('incomplete', 'Connection Error',
                    'Could not verify your Stripe account. Please try again.',
                    'Retry', checkStatus);
            }
        }

        async function resumeOnboarding() {
            var token = getToken();
            var btn = document.getElementById('continueBtn');
            btn.disabled = true;
            btn.textContent = 'Redirecting...';

            try {
                var resp = await fetch(API_BASE + '/api/stripe/create-account-link', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!resp.ok) throw new Error('API error: ' + resp.status);
                var data = await resp.json();

                if (data.url) {
                    window.location.href = data.url;
                } else if (data.already_onboarded) {
                    checkStatus();
                }
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btn.textContent = 'Try Again';
            }
        }

        function showState(type, heading, message, btnText, btnAction) {
            document.getElementById('icon').textContent =
                type === 'active' ? '\u2713' : type === 'pending' ? '\u23F3' : '\u26A0';
            document.getElementById('heading').textContent = heading;
            document.getElementById('message').textContent = message;
            var box = document.getElementById('statusBox');
            box.className = 'status-box ' + type;
            box.innerHTML = '<strong>' + heading + '</strong>';
            var btn = document.getElementById('continueBtn');
            btn.textContent = btnText;
            btn.className = '';
            btn.disabled = false;
            btn.onclick = btnAction;
        }

        function continueFlow() {
            window.location.href = 'index.html';
        }

        setTimeout(checkStatus, 500);
    </script>
</body>
</html>
