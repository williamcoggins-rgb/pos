<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Setup Complete - BarberScore POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F3F4F6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .icon {
            width: 64px;
            height: 64px;
            background: #10B981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 32px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #111827; }
        p { color: #6B7280; margin-bottom: 20px; }
        .loader {
            width: 24px;
            height: 24px;
            border: 3px solid #E5E7EB;
            border-top-color: #DC2626;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#10003;</div>
        <h1>Stripe Connected!</h1>
        <p>Your payment account is set up. Redirecting you to create your PIN...</p>
        <div class="loader"></div>
    </div>
    <script>
        // Mark Stripe onboarding as complete and redirect to main app
        localStorage.setItem('onboarding_step', 'stripe_complete');
        setTimeout(() => {
            window.location.href = '/?stripe=success';
        }, 1500);
    </script>
</body>
</html>
