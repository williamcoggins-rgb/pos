<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refresh Payment Setup - BarberScore POS</title>
    <script src="api-service.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .message.error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔄</div>
        <h1>Continue Payment Setup</h1>
        <p>Your payment setup link has expired or needs to be refreshed. Click the button below to get a new link and continue where you left off.</p>

        <button onclick="refreshLink()" id="refreshBtn">
            <span id="btnText">Get New Link</span>
        </button>

        <div id="message" class="message"></div>

        <p style="margin-top: 30px; font-size: 14px; color: #999;">
            Already completed setup? <a href="pos-v4.html" style="color: #667eea;">Go to POS</a>
        </p>
    </div>

    <script>
        async function refreshLink() {
            const btn = document.getElementById('refreshBtn');
            const btnText = document.getElementById('btnText');
            const messageDiv = document.getElementById('message');

            btn.disabled = true;
            btnText.innerHTML = 'Getting new link<span class="loading"></span>';
            messageDiv.style.display = 'none';

            try {
                const response = await api.request('/stripe/create-account-link', {
                    method: 'POST'
                });

                if (response.url) {
                    // Redirect to new onboarding link
                    window.location.href = response.url;
                } else {
                    throw new Error('No URL returned');
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.className = 'message error';
                messageDiv.textContent = `Error: ${error.message}. Please try again or contact support.`;
                messageDiv.style.display = 'block';
                btn.disabled = false;
                btnText.textContent = 'Try Again';
            }
        }
    </script>
</body>
</html>
