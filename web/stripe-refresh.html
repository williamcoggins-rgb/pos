<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue Setup - BarberScore POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { color: #333; margin-bottom: 12px; font-size: 22px; }
        p { color: #666; line-height: 1.6; margin-bottom: 20px; font-size: 15px; }
        button {
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #16213e; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg {
            background: #fce4ec;
            border-left: 4px solid #f44336;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            text-align: left;
            font-size: 14px;
            display: none;
        }
        .secondary {
            margin-top: 24px;
            font-size: 14px;
            color: #999;
        }
        .secondary a { color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&orarr;</div>
        <h1>Continue Payment Setup</h1>
        <p>Your Stripe setup link expired or needs to be refreshed. Click below to get a new link and pick up where you left off.</p>

        <button onclick="refreshLink()" id="refreshBtn">Get New Link</button>

        <div id="errorMsg" class="error-msg"></div>

        <p class="secondary">
            Already completed setup? <a href="index.html">Go to POS</a>
        </p>
    </div>

    <script>
        var API_BASE = window.API_BASE_URL || window.location.origin;

        function getToken() {
            return localStorage.getItem('access_token') || '';
        }

        async function refreshLink() {
            var btn = document.getElementById('refreshBtn');
            var errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.textContent = 'Getting new link...';
            errorMsg.style.display = 'none';

            var token = getToken();
            if (!token) {
                errorMsg.textContent = 'You are not logged in. Please log in first.';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Go to Login';
                btn.onclick = function() { window.location.href = 'login.html'; };
                return;
            }

            try {
                var resp = await fetch(API_BASE + '/api/stripe/create-account-link', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!resp.ok) throw new Error('Server error: ' + resp.status);
                var data = await resp.json();

                if (data.url) {
                    window.location.href = data.url;
                } else if (data.already_onboarded) {
                    window.location.href = 'stripe-success.html';
                } else {
                    throw new Error('No onboarding URL returned');
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = err.message + '. Please try again.';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Try Again';
            }
        }
    </script>
</body>
</html>
