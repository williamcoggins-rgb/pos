<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refresh Payment Setup - BarberScore POS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F3F4F6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .icon {
            width: 64px;
            height: 64px;
            background: #F59E0B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 28px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #111827; }
        p { color: #6B7280; margin-bottom: 20px; line-height: 1.5; }
        .btn {
            background: #DC2626;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover:not(:disabled) { background: #B91C1C; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            background: #FEE2E2;
            border-left: 4px solid #EF4444;
            color: #991B1B;
            padding: 12px;
            border-radius: 4px;
            margin-top: 16px;
            text-align: left;
            display: none;
        }
        .link { color: #DC2626; text-decoration: none; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#8635;</div>
        <h1>Continue Setup</h1>
        <p>Your Stripe setup link has expired. Click below to get a new link and continue setting up payments.</p>

        <button class="btn" onclick="refreshLink()" id="refreshBtn">
            <span id="btnText">Get New Link</span>
        </button>

        <div id="error" class="error"></div>

        <p style="margin-top: 24px; font-size: 14px;">
            Already completed? <a href="/" class="link">Go to App</a>
        </p>
    </div>

    <script>
        const API_URL = 'https://pos-production-fd37.up.railway.app';

        async function refreshLink() {
            const btn = document.getElementById('refreshBtn');
            const btnText = document.getElementById('btnText');
            const errorDiv = document.getElementById('error');

            const token = localStorage.getItem('token');
            if (!token) {
                errorDiv.textContent = 'Please sign up again to continue.';
                errorDiv.style.display = 'block';
                setTimeout(() => window.location.href = '/', 2000);
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = 'Getting link<span class="loader"></span>';
            errorDiv.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/api/stripe/create-account-link`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                const result = await res.json();

                if (res.ok && result.url) {
                    window.location.href = result.url;
                } else if (result.already_onboarded) {
                    localStorage.setItem('onboarding_step', 'stripe_complete');
                    window.location.href = '/?stripe=success';
                } else {
                    throw new Error(result.detail || 'Could not get new link');
                }
            } catch (err) {
                errorDiv.textContent = err.message || 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btnText.textContent = 'Try Again';
            }
        }
    </script>
</body>
</html>
