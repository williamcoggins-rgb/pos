<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberScore POS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* White & Red Professional Color Scheme */
            --white: #FFFFFF;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;

            /* Red Accents */
            --red-50: #FEF2F2;
            --red-100: #FEE2E2;
            --red-500: #EF4444;
            --red-600: #DC2626;
            --red-700: #B91C1C;

            /* Success/Money */
            --green-500: #10B981;
            --green-600: #059669;

            /* Warning */
            --amber-500: #F59E0B;

            /* Primary Colors */
            --bg-primary: var(--white);
            --bg-secondary: var(--gray-50);
            --bg-elevated: var(--white);
            --text-primary: var(--gray-900);
            --text-secondary: var(--gray-600);
            --text-tertiary: var(--gray-400);
            --accent-primary: var(--red-600);
            --accent-hover: var(--red-700);
            --border-color: var(--gray-200);

            /* Spacing */
            --spacing-xs: 0.5rem;
            --spacing-sm: 0.75rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;

            /* Border Radius */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;

            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

            /* Transitions */
            --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }

        .btn-success {
            background: var(--green-600);
            color: white;
        }

        .btn-success:hover {
            background: var(--green-500);
        }

        .btn-lg {
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
        }

        .btn-block {
            width: 100%;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: var(--spacing-lg);
        }

        .input-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .input-label .required {
            color: var(--accent-primary);
            margin-left: 0.25rem;
        }

        .input-field {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.875rem;
            font-family: inherit;
            transition: all var(--transition);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .input-error {
            color: var(--accent-primary);
            font-size: 0.75rem;
            margin-top: var(--spacing-xs);
        }

        /* Cards */
        .card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
        }

        .card-header {
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: var(--spacing-xs);
        }

        /* Onboarding */
        .onboarding-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl);
        }

        .onboarding-card {
            width: 100%;
            max-width: 500px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-lg);
        }

        .onboarding-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .onboarding-logo {
            width: 60px;
            height: 60px;
            margin: 0 auto var(--spacing-md);
            background: var(--accent-primary);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            font-weight: 700;
        }

        .onboarding-title {
            font-size: 1.875rem;
            font-weight: 900;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .onboarding-subtitle {
            color: var(--text-secondary);
            font-size: 0.9375rem;
        }

        /* PIN Input */
        .pin-inputs {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
            margin: var(--spacing-xl) 0;
        }

        .pin-input {
            width: 3.5rem;
            height: 3.5rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            transition: all var(--transition);
        }

        .pin-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        /* Main App Layout */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 240px;
            background: white;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .sidebar-logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .sidebar-logo-text {
            font-weight: 700;
            font-size: 1.125rem;
        }

        .sidebar-nav {
            flex: 1;
            padding: var(--spacing-md);
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: 0.75rem var(--spacing-md);
            margin-bottom: var(--spacing-xs);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition);
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .nav-item:hover {
            background: var(--gray-50);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--red-50);
            color: var(--accent-primary);
            font-weight: 600;
        }

        .nav-icon {
            font-size: 1.125rem;
        }

        .sidebar-footer {
            padding: var(--spacing-md);
            border-top: 1px solid var(--border-color);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-secondary);
        }

        .content-header {
            background: white;
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-lg) var(--spacing-xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .content-body {
            padding: var(--spacing-xl);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        /* Stat Card */
        .stat-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
        }

        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-md);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            background: var(--red-50);
            color: var(--accent-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .stat-change {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .stat-change.positive {
            color: var(--green-600);
        }

        .stat-change.negative {
            color: var(--accent-primary);
        }

        /* BarberScore Display */
        .score-display {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--red-700) 100%);
            border-radius: var(--radius-lg);
            padding: var(--spacing-2xl);
            color: white;
            margin-bottom: var(--spacing-xl);
            box-shadow: var(--shadow-lg);
        }

        .score-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .score-label {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: var(--spacing-sm);
        }

        .score-value {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: var(--spacing-sm);
        }

        .score-tier {
            font-size: 1.25rem;
            font-weight: 600;
            opacity: 0.95;
        }

        .score-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
        }

        .score-metric {
            background: rgba(255, 255, 255, 0.1);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
        }

        .score-metric-label {
            font-size: 0.875rem;
            opacity: 0.9;
            margin-bottom: var(--spacing-xs);
        }

        .score-metric-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* Service Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: var(--spacing-md);
        }

        .service-card {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
        }

        .service-card:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .service-name {
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            color: var(--text-primary);
        }

        .service-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        /* Table */
        .table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .table th {
            background: var(--gray-50);
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .table td {
            padding: 0.875rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
        }

        .table tr:last-child td {
            border-bottom: none;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background: #D1FAE5;
            color: var(--green-600);
        }

        .badge-warning {
            background: #FEF3C7;
            color: var(--amber-500);
        }

        .badge-danger {
            background: var(--red-100);
            color: var(--accent-primary);
        }

        .badge-gray {
            background: var(--gray-100);
            color: var(--gray-600);
        }

        /* Procurement Section */
        .tier-card {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .tier-card.locked {
            opacity: 0.6;
        }

        .tier-card.unlocked {
            border-color: var(--green-600);
            background: #F0FDF4;
        }

        .tier-card.current {
            border-color: var(--accent-primary);
            background: var(--red-50);
        }

        .tier-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }

        .tier-name {
            font-size: 1.125rem;
            font-weight: 700;
        }

        .tier-score-range {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .tier-benefits {
            list-style: none;
            padding: 0;
        }

        .tier-benefits li {
            padding: var(--spacing-xs) 0;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .tier-benefits li:before {
            content: "✓";
            color: var(--green-600);
            font-weight: 700;
            margin-right: var(--spacing-sm);
        }

        /* Time Period Selector */
        .period-selector {
            display: flex;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-lg);
            background: white;
            padding: var(--spacing-xs);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            width: fit-content;
        }

        .period-btn {
            padding: 0.5rem 1rem;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-secondary);
            transition: all var(--transition);
        }

        .period-btn.active {
            background: var(--accent-primary);
            color: white;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: var(--spacing-xl);
        }

        .modal {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
        }

        .modal-header {
            margin-bottom: var(--spacing-xl);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: var(--spacing-xs);
        }

        .modal-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-xl);
        }

        /* Cart Sidebar */
        .cart-sidebar {
            width: 360px;
            background: white;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 1.125rem;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md);
        }

        .cart-item {
            background: var(--gray-50);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .cart-item-price {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .cart-item-remove {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--accent-primary);
            font-weight: 600;
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding: var(--spacing-lg);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--spacing-sm);
            font-size: 0.875rem;
        }

        .cart-total.total {
            font-size: 1.25rem;
            font-weight: 700;
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-color);
            margin-top: var(--spacing-md);
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .mb-4 {
            margin-bottom: var(--spacing-lg);
        }

        .mt-4 {
            margin-top: var(--spacing-lg);
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--text-tertiary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-md);
            opacity: 0.3;
        }

        /* Success State */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(16, 185, 129, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            color: white;
        }

        .success-icon {
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: var(--spacing-lg);
        }

        .success-message {
            font-size: 2rem;
            font-weight: 700;
        }

        /* File Upload */
        .file-upload {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
        }

        .file-upload:hover {
            border-color: var(--accent-primary);
            background: var(--red-50);
        }

        .file-upload input {
            display: none;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                position: fixed;
                left: -240px;
                top: 0;
                bottom: 0;
                z-index: 100;
                transition: left var(--transition);
            }

            .sidebar.open {
                left: 0;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .cart-sidebar {
                position: fixed;
                bottom: -100%;
                left: 0;
                right: 0;
                width: 100%;
                height: 70vh;
                border-left: none;
                border-top: 1px solid var(--border-color);
                border-radius: var(--radius-xl) var(--radius-xl) 0 0;
                z-index: 90;
                transition: bottom var(--transition);
            }

            .cart-sidebar.open {
                bottom: 0;
            }

            .services-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="api-client.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Main App Component
        function App() {
            const [currentScreen, setCurrentScreen] = useState('welcome'); // welcome, setup, passcode, main
            const [currentView, setCurrentView] = useState('dashboard'); // dashboard, pos, analytics, barberscore, procurement, settings
            const [user, setUser] = useState(null);
            const [services, setServices] = useState([]);
            const [cart, setCart] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [showModal, setShowModal] = useState(null);
            const [selectedService, setSelectedService] = useState(null);
            const [showSuccess, setShowSuccess] = useState(false);
            const [error, setError] = useState('');
            const [analyticsPeriod, setAnalyticsPeriod] = useState('week'); // day, week, month, year

            useEffect(() => {
                checkAuth();
                loadTransactions();
            }, []);

            const checkAuth = () => {
                const savedUser = localStorage.getItem('pos_user');
                const savedServices = localStorage.getItem('pos_services');

                if (savedUser) {
                    setUser(JSON.parse(savedUser));
                    setServices(savedServices ? JSON.parse(savedServices) : []);

                    const hasPasscode = localStorage.getItem('pos_passcode');
                    if (!hasPasscode) {
                        setCurrentScreen('passcode');
                    } else {
                        setShowModal('passcode');
                    }
                } else {
                    setCurrentScreen('welcome');
                }
            };

            const loadTransactions = () => {
                const saved = localStorage.getItem('pos_transactions');
                if (saved) {
                    setTransactions(JSON.parse(saved));
                }
            };

            const handleBusinessSetup = (businessData) => {
                const newUser = {
                    id: Date.now().toString(),
                    ...businessData,
                    createdAt: new Date().toISOString(),
                    barberScore: 0,
                    tier: 'Level 0'
                };

                setUser(newUser);
                localStorage.setItem('pos_user', JSON.stringify(newUser));
                setCurrentScreen('passcode');
            };

            const handlePasscodeSetup = (passcode) => {
                localStorage.setItem('pos_passcode', passcode);
                setCurrentScreen('main');
            };

            const handlePasscodeVerify = (passcode) => {
                const savedPasscode = localStorage.getItem('pos_passcode');
                if (passcode === savedPasscode) {
                    setShowModal(null);
                    setCurrentScreen('main');
                } else {
                    setError('Incorrect passcode');
                    setTimeout(() => setError(''), 2000);
                }
            };

            const addService = (service) => {
                const newService = { id: Date.now().toString(), ...service };
                const updated = [...services, newService];
                setServices(updated);
                localStorage.setItem('pos_services', JSON.stringify(updated));
            };

            const editService = (id, updates) => {
                const updated = services.map(s => s.id === id ? { ...s, ...updates } : s);
                setServices(updated);
                localStorage.setItem('pos_services', JSON.stringify(updated));
            };

            const deleteService = (id) => {
                const updated = services.filter(s => s.id !== id);
                setServices(updated);
                localStorage.setItem('pos_services', JSON.stringify(updated));
            };

            const addToCart = (service) => {
                setCart([...cart, { ...service, cartId: Date.now().toString() }]);
            };

            const removeFromCart = (cartId) => {
                setCart(cart.filter(item => item.cartId !== cartId));
            };

            const clearCart = () => {
                setCart([]);
            };

            const calculateTotal = () => {
                const subtotal = cart.reduce((sum, item) => sum + parseFloat(item.price), 0);
                const tax = subtotal * 0.08;
                const total = subtotal + tax;
                return { subtotal, tax, total };
            };

            const handleCheckout = () => {
                if (cart.length === 0) return;

                const transaction = {
                    id: Date.now().toString(),
                    items: cart,
                    ...calculateTotal(),
                    timestamp: new Date().toISOString(),
                    barberId: user.id,
                    shopName: user.shopName
                };

                const updated = [...transactions, transaction];
                setTransactions(updated);
                localStorage.setItem('pos_transactions', JSON.stringify(updated));

                // Update BarberScore (simplified)
                updateBarberScore(transaction);

                setShowSuccess(true);
                setCart([]);
                setShowModal(null);

                setTimeout(() => {
                    setShowSuccess(false);
                }, 2000);
            };

            const updateBarberScore = (transaction) => {
                // Simplified scoring: +1 point per $10 spent
                const points = Math.floor(transaction.total / 10);
                const newScore = Math.min(100, user.barberScore + points);
                const newTier = calculateTier(newScore);

                const updatedUser = {
                    ...user,
                    barberScore: newScore,
                    tier: newTier
                };

                setUser(updatedUser);
                localStorage.setItem('pos_user', JSON.stringify(updatedUser));
            };

            const calculateTier = (score) => {
                if (score >= 95) return 'Level 4';
                if (score >= 85) return 'Level 3';
                if (score >= 70) return 'Level 2';
                if (score >= 50) return 'Level 1';
                return 'Level 0';
            };

            const getAnalytics = () => {
                const now = new Date();
                let filtered = transactions;

                switch (analyticsPeriod) {
                    case 'day':
                        filtered = transactions.filter(t => {
                            const tDate = new Date(t.timestamp);
                            return tDate.toDateString() === now.toDateString();
                        });
                        break;
                    case 'week':
                        const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                        filtered = transactions.filter(t => new Date(t.timestamp) >= weekAgo);
                        break;
                    case 'month':
                        filtered = transactions.filter(t => {
                            const tDate = new Date(t.timestamp);
                            return tDate.getMonth() === now.getMonth() && tDate.getFullYear() === now.getFullYear();
                        });
                        break;
                    case 'year':
                        filtered = transactions.filter(t => {
                            const tDate = new Date(t.timestamp);
                            return tDate.getFullYear() === now.getFullYear();
                        });
                        break;
                }

                const revenue = filtered.reduce((sum, t) => sum + t.total, 0);
                const count = filtered.length;
                const avgTransaction = count > 0 ? revenue / count : 0;

                return { revenue, count, avgTransaction, transactions: filtered };
            };

            const handleCSVImport = (file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const lines = text.split('\n').slice(1); // Skip header
                    const imported = [];

                    lines.forEach(line => {
                        const [timestamp, amount, items] = line.split(',');
                        if (timestamp && amount) {
                            imported.push({
                                id: Date.now().toString() + Math.random(),
                                timestamp,
                                total: parseFloat(amount),
                                subtotal: parseFloat(amount) / 1.08,
                                tax: parseFloat(amount) * 0.08 / 1.08,
                                items: items ? items.split('|').map(i => ({ name: i })) : [],
                                barberId: user.id,
                                shopName: user.shopName,
                                imported: true
                            });
                        }
                    });

                    const updated = [...transactions, ...imported];
                    setTransactions(updated);
                    localStorage.setItem('pos_transactions', JSON.stringify(updated));
                    alert(`Imported ${imported.length} transactions`);
                    setShowModal(null);
                };
                reader.readAsText(file);
            };

            // Render screens
            if (currentScreen === 'welcome') {
                return <WelcomeScreen onNext={() => setCurrentScreen('setup')} />;
            }

            if (currentScreen === 'setup') {
                return <BusinessSetupScreen onComplete={handleBusinessSetup} onBack={() => setCurrentScreen('welcome')} />;
            }

            if (currentScreen === 'passcode') {
                return <PasscodeSetupScreen onComplete={handlePasscodeSetup} isSetup={true} />;
            }

            if (currentScreen === 'main') {
                return (
                    <>
                        <div className="app-container">
                            <Sidebar
                                currentView={currentView}
                                onViewChange={setCurrentView}
                                user={user}
                                onLogout={() => {
                                    localStorage.clear();
                                    window.location.reload();
                                }}
                            />

                            <MainContent
                                currentView={currentView}
                                user={user}
                                services={services}
                                cart={cart}
                                transactions={transactions}
                                analyticsPeriod={analyticsPeriod}
                                onPeriodChange={setAnalyticsPeriod}
                                onAddToCart={addToCart}
                                onRemoveFromCart={removeFromCart}
                                onClearCart={clearCart}
                                onCheckout={() => setShowModal('checkout')}
                                onAddService={() => setShowModal('addService')}
                                onEditService={(service) => {
                                    setSelectedService(service);
                                    setShowModal('editService');
                                }}
                                onImportCSV={() => setShowModal('importCSV')}
                                calculateTotal={calculateTotal}
                                getAnalytics={getAnalytics}
                            />
                        </div>

                        {/* Modals */}
                        {showModal === 'addService' && (
                            <ServiceModal onClose={() => setShowModal(null)} onSave={addService} />
                        )}

                        {showModal === 'editService' && (
                            <ServiceModal
                                service={selectedService}
                                onClose={() => {
                                    setShowModal(null);
                                    setSelectedService(null);
                                }}
                                onSave={(updates) => editService(selectedService.id, updates)}
                                onDelete={() => {
                                    deleteService(selectedService.id);
                                    setShowModal(null);
                                    setSelectedService(null);
                                }}
                            />
                        )}

                        {showModal === 'checkout' && (
                            <CheckoutModal
                                cart={cart}
                                totals={calculateTotal()}
                                onClose={() => setShowModal(null)}
                                onConfirm={handleCheckout}
                            />
                        )}

                        {showModal === 'importCSV' && (
                            <CSVImportModal
                                onClose={() => setShowModal(null)}
                                onImport={handleCSVImport}
                            />
                        )}

                        {showModal === 'passcode' && (
                            <PasscodeVerifyModal
                                onVerify={handlePasscodeVerify}
                                error={error}
                            />
                        )}

                        {showSuccess && <SuccessOverlay />}
                    </>
                );
            }

            return null;
        }

        // Welcome Screen
        function WelcomeScreen({ onNext }) {
            return (
                <div className="onboarding-container">
                    <div className="onboarding-card">
                        <div className="onboarding-header">
                            <div className="onboarding-logo">BS</div>
                            <h1 className="onboarding-title">BarberScore POS</h1>
                            <p className="onboarding-subtitle">
                                Complete point-of-sale system with integrated BarberScore tracking and procurement access.
                            </p>
                        </div>

                        <div style={{ marginBottom: 'var(--spacing-xl)' }}>
                            <div style={{ marginBottom: 'var(--spacing-md)', paddingBottom: 'var(--spacing-md)', borderBottom: '1px solid var(--border-color)' }}>
                                <strong>Track Your Score</strong>
                                <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', marginTop: '0.25rem' }}>
                                    Every transaction builds your BarberScore, unlocking better pricing and procurement access.
                                </p>
                            </div>

                            <div style={{ marginBottom: 'var(--spacing-md)', paddingBottom: 'var(--spacing-md)', borderBottom: '1px solid var(--border-color)' }}>
                                <strong>Earn Procurement Access</strong>
                                <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', marginTop: '0.25rem' }}>
                                    Build your score to unlock warehouse ordering, better pricing, and net terms.
                                </p>
                            </div>

                            <div>
                                <strong>Manage Everything</strong>
                                <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', marginTop: '0.25rem' }}>
                                    Services, pricing, analytics, and income tracking all in one place.
                                </p>
                            </div>
                        </div>

                        <button className="btn btn-primary btn-lg btn-block" onClick={onNext}>
                            Get Started
                        </button>
                    </div>
                </div>
            );
        }

        // Business Setup Screen
        function BusinessSetupScreen({ onComplete, onBack }) {
            const [formData, setFormData] = useState({
                shopName: '',
                ownerName: '',
                email: '',
                phone: ''
            });
            const [errors, setErrors] = useState({});

            const validate = () => {
                const newErrors = {};
                if (!formData.shopName.trim()) newErrors.shopName = 'Shop name is required';
                if (!formData.ownerName.trim()) newErrors.ownerName = 'Owner name is required';
                if (!formData.email.trim()) {
                    newErrors.email = 'Email is required';
                } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
                    newErrors.email = 'Invalid email address';
                }
                if (!formData.phone.trim()) {
                    newErrors.phone = 'Phone number is required';
                } else if (!/^\(?([0-9]{3})\)?[-. ]?([0-9]{3})[-. ]?([0-9]{4})$/.test(formData.phone)) {
                    newErrors.phone = 'Invalid phone number';
                }
                return newErrors;
            };

            const handleSubmit = () => {
                const newErrors = validate();
                if (Object.keys(newErrors).length > 0) {
                    setErrors(newErrors);
                    return;
                }
                onComplete(formData);
            };

            return (
                <div className="onboarding-container">
                    <div className="onboarding-card">
                        <div className="onboarding-header">
                            <h2 className="onboarding-title">Set Up Your Business</h2>
                            <p className="onboarding-subtitle">Enter your business information to get started</p>
                        </div>

                        <div className="input-group">
                            <label className="input-label">
                                Shop Name <span className="required">*</span>
                            </label>
                            <input
                                type="text"
                                className="input-field"
                                placeholder="e.g. The Fresh Cut"
                                value={formData.shopName}
                                onChange={(e) => setFormData({ ...formData, shopName: e.target.value })}
                            />
                            {errors.shopName && <div className="input-error">{errors.shopName}</div>}
                        </div>

                        <div className="input-group">
                            <label className="input-label">
                                Owner Name <span className="required">*</span>
                            </label>
                            <input
                                type="text"
                                className="input-field"
                                placeholder="Your full name"
                                value={formData.ownerName}
                                onChange={(e) => setFormData({ ...formData, ownerName: e.target.value })}
                            />
                            {errors.ownerName && <div className="input-error">{errors.ownerName}</div>}
                        </div>

                        <div className="input-group">
                            <label className="input-label">
                                Email <span className="required">*</span>
                            </label>
                            <input
                                type="email"
                                className="input-field"
                                placeholder="your@email.com"
                                value={formData.email}
                                onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                            />
                            {errors.email && <div className="input-error">{errors.email}</div>}
                        </div>

                        <div className="input-group">
                            <label className="input-label">
                                Phone Number <span className="required">*</span>
                            </label>
                            <input
                                type="tel"
                                className="input-field"
                                placeholder="(555) 123-4567"
                                value={formData.phone}
                                onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                            />
                            {errors.phone && <div className="input-error">{errors.phone}</div>}
                        </div>

                        <div style={{ display: 'flex', gap: 'var(--spacing-sm)' }}>
                            <button className="btn btn-secondary btn-block" onClick={onBack}>
                                Back
                            </button>
                            <button className="btn btn-primary btn-block" onClick={handleSubmit}>
                                Continue
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Passcode Setup Screen
        function PasscodeSetupScreen({ onComplete }) {
            const [pin, setPin] = useState(['', '', '', '']);
            const [confirmPin, setConfirmPin] = useState(['', '', '', '']);
            const [step, setStep] = useState(1);
            const [error, setError] = useState('');
            const inputRefs = [useRef(), useRef(), useRef(), useRef()];
            const confirmRefs = [useRef(), useRef(), useRef(), useRef()];

            const handlePinChange = (index, value, refs, setter, pinArray) => {
                if (!/^\d*$/.test(value)) return;

                const newPin = [...pinArray];
                newPin[index] = value;
                setter(newPin);

                if (value && index < 3) {
                    refs[index + 1].current.focus();
                }
            };

            const handleKeyDown = (index, e, refs, pinArray) => {
                if (e.key === 'Backspace' && !pinArray[index] && index > 0) {
                    refs[index - 1].current.focus();
                }
            };

            const handleSubmit = () => {
                if (step === 1) {
                    if (pin.some(digit => !digit)) {
                        setError('Please enter all 4 digits');
                        return;
                    }
                    setStep(2);
                    setError('');
                    setTimeout(() => confirmRefs[0].current?.focus(), 100);
                } else {
                    const pinCode = pin.join('');
                    const confirmCode = confirmPin.join('');

                    if (confirmCode.length !== 4) {
                        setError('Please enter all 4 digits');
                        return;
                    }

                    if (pinCode !== confirmCode) {
                        setError('Passcodes do not match');
                        setConfirmPin(['', '', '', '']);
                        setTimeout(() => confirmRefs[0].current?.focus(), 100);
                        return;
                    }

                    onComplete(pinCode);
                }
            };

            return (
                <div className="onboarding-container">
                    <div className="onboarding-card">
                        <div className="onboarding-header">
                            <div className="onboarding-logo">🔒</div>
                            <h2 className="onboarding-title">
                                {step === 1 ? 'Create Passcode' : 'Confirm Passcode'}
                            </h2>
                            <p className="onboarding-subtitle">
                                {step === 1
                                    ? 'Choose a 4-digit code to secure your POS'
                                    : 'Enter your passcode again to confirm'}
                            </p>
                        </div>

                        {step === 1 ? (
                            <div className="pin-inputs">
                                {pin.map((digit, index) => (
                                    <input
                                        key={index}
                                        ref={inputRefs[index]}
                                        type="password"
                                        inputMode="numeric"
                                        maxLength="1"
                                        className="pin-input"
                                        value={digit}
                                        onChange={(e) => handlePinChange(index, e.target.value, inputRefs, setPin, pin)}
                                        onKeyDown={(e) => handleKeyDown(index, e, inputRefs, pin)}
                                        autoFocus={index === 0}
                                    />
                                ))}
                            </div>
                        ) : (
                            <div className="pin-inputs">
                                {confirmPin.map((digit, index) => (
                                    <input
                                        key={index}
                                        ref={confirmRefs[index]}
                                        type="password"
                                        inputMode="numeric"
                                        maxLength="1"
                                        className="pin-input"
                                        value={digit}
                                        onChange={(e) => handlePinChange(index, e.target.value, confirmRefs, setConfirmPin, confirmPin)}
                                        onKeyDown={(e) => handleKeyDown(index, e, confirmRefs, confirmPin)}
                                    />
                                ))}
                            </div>
                        )}

                        {error && (
                            <div className="input-error text-center" style={{ marginTop: 'var(--spacing-md)' }}>
                                {error}
                            </div>
                        )}

                        <button
                            className="btn btn-primary btn-lg btn-block"
                            style={{ marginTop: 'var(--spacing-xl)' }}
                            onClick={handleSubmit}
                        >
                            {step === 1 ? 'Continue' : 'Complete Setup'}
                        </button>

                        {step === 2 && (
                            <button
                                className="btn btn-secondary btn-block"
                                style={{ marginTop: 'var(--spacing-sm)' }}
                                onClick={() => {
                                    setStep(1);
                                    setConfirmPin(['', '', '', '']);
                                    setError('');
                                }}
                            >
                                Back
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // Passcode Verify Modal
        function PasscodeVerifyModal({ onVerify, error }) {
            const [pin, setPin] = useState(['', '', '', '']);
            const inputRefs = [useRef(), useRef(), useRef(), useRef()];

            const handlePinChange = (index, value) => {
                if (!/^\d*$/.test(value)) return;

                const newPin = [...pin];
                newPin[index] = value;
                setPin(newPin);

                if (value && index < 3) {
                    inputRefs[index + 1].current.focus();
                }

                if (index === 3 && value) {
                    setTimeout(() => {
                        onVerify([...newPin.slice(0, 3), value].join(''));
                    }, 100);
                }
            };

            const handleKeyDown = (index, e) => {
                if (e.key === 'Backspace' && !pin[index] && index > 0) {
                    inputRefs[index - 1].current.focus();
                }
            };

            useEffect(() => {
                if (error) {
                    setPin(['', '', '', '']);
                    inputRefs[0].current?.focus();
                }
            }, [error]);

            return (
                <div className="modal-overlay">
                    <div className="modal">
                        <div className="modal-header">
                            <div className="onboarding-logo" style={{ margin: '0 auto var(--spacing-md)' }}>🔐</div>
                            <h3 className="modal-title text-center">Enter Passcode</h3>
                            <p className="card-subtitle text-center">
                                Enter your 4-digit passcode to access POS
                            </p>
                        </div>

                        <div className="pin-inputs">
                            {pin.map((digit, index) => (
                                <input
                                    key={index}
                                    ref={inputRefs[index]}
                                    type="password"
                                    inputMode="numeric"
                                    maxLength="1"
                                    className="pin-input"
                                    value={digit}
                                    onChange={(e) => handlePinChange(index, e.target.value)}
                                    onKeyDown={(e) => handleKeyDown(index, e)}
                                    autoFocus={index === 0}
                                />
                            ))}
                        </div>

                        {error && (
                            <div className="input-error text-center" style={{ marginTop: 'var(--spacing-md)' }}>
                                {error}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

                <div className="sidebar">
                    <div className="sidebar-header">
                        <div className="sidebar-logo">
                            <div className="sidebar-logo-icon">BS</div>

                    <div className="sidebar-nav">

                        >

                            <span>Income Analytics</span>
                        </div>

                            onClick={() => onViewChange('barberscore')}
                        >
                            <span className="nav-icon">⭐</span>
                            <span>BarberScore</span>
                        </div>

                        <div
                            className={`nav-item ${currentView === 'procurement' ? 'active' : ''}`}
                            onClick={() => onViewChange('procurement')}
                        >
                            <span className="nav-icon">📦</span>
                            <span>Procurement</span>
                        </div>

                        <div
                            className={`nav-item ${currentView === 'settings' ? 'active' : ''}`}
                            onClick={() => onViewChange('settings')}
                        >
                            <span className="nav-icon">⚙️</span>
                            <span>Settings</span>
                        </div>
                    </div>

                    <div className="sidebar-footer">
                        <div style={{ marginBottom: 'var(--spacing-sm)', paddingBottom: 'var(--spacing-sm)', borderBottom: '1px solid var(--border-color)' }}>
                            <div style={{ fontWeight: 600, fontSize: '0.875rem' }}>{user.shopName}</div>
                            <div style={{ fontSize: '0.75rem', color: 'var(--text-tertiary)' }}>{user.ownerName}</div>
                        </div>
                        <button className="btn btn-secondary btn-block" onClick={onLogout}>
                            Lock & Exit
                        </button>
                    </div>
                </div>
            );
        }

        // Main Content Component
        function MainContent({ currentView, user, services, cart, transactions, analyticsPeriod, onPeriodChange, onAddToCart, onRemoveFromCart, onClearCart, onCheckout, onAddService, onEditService, onImportCSV, calculateTotal, getAnalytics }) {
            const renderView = () => {
                switch (currentView) {
                    case 'dashboard':
                        return <DashboardView user={user} transactions={transactions} getAnalytics={getAnalytics} />;
                    case 'pos':
                        return <POSView services={services} cart={cart} onAddToCart={onAddToCart} onRemoveFromCart={onRemoveFromCart} onClearCart={onClearCart} onCheckout={onCheckout} onAddService={onAddService} onEditService={onEditService} calculateTotal={calculateTotal} />;
                    case 'analytics':
                        return <AnalyticsView period={analyticsPeriod} onPeriodChange={onPeriodChange} getAnalytics={getAnalytics} />;
                    case 'barberscore':
                        return <BarberScoreView user={user} transactions={transactions} />;
                    case 'procurement':

            if (score < 50) return 50;

            if (score < 95) return 95;
            return 100;
        }

                            <div className="text-center" style={{ padding: 'var(--spacing-xl)' }}>
                                <div style={{ fontSize: '2rem', marginBottom: 'var(--spacing-md)' }}>⏳</div>
                                <div style={{ color: 'var(--text-secondary)' }}>Processing payment...</div>
                            </div>
                        ) : (
                            <div className="modal-actions">
                                <button className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                                <button className="btn btn-success" onClick={handleConfirm} style={{ flex: 2 }}>
                                    Charge ${totals.total.toFixed(2)}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // CSV Import Modal
        function CSVImportModal({ onClose, onImport }) {
            const fileInputRef = useRef();

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    onImport(file);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h3 className="modal-title">Import Transaction Data</h3>
                            <p className="card-subtitle">Upload a CSV file with your historical transactions</p>
                        </div>

                        <div className="card mb-4">
                            <h4 style={{ marginBottom: 'var(--spacing-md)', fontWeight: 600, fontSize: '0.875rem' }}>CSV Format</h4>
                            <pre style={{ background: 'var(--gray-50)', padding: 'var(--spacing-md)', borderRadius: 'var(--radius-md)', fontSize: '0.75rem', overflow: 'auto' }}>
{`timestamp, amount, items (optional)
2026-01-15T10:30:00, 45.50, Haircut|Shave
2026-01-15T14:20:00, 35.00, Haircut
2026-01-16T09:15:00, 65.00, Haircut|Color`}
                            </pre>
                        </div>

                        <div
                            className="file-upload"
                            onClick={() => fileInputRef.current?.click()}
                        >
                            <div style={{ fontSize: '2rem', marginBottom: 'var(--spacing-sm)' }}>📁</div>
                            <div style={{ fontWeight: 600, marginBottom: 'var(--spacing-xs)' }}>Click to upload CSV file</div>
                            <div style={{ fontSize: '0.875rem', color: 'var(--text-secondary)' }}>
                                Your BarberScore will be updated based on imported transactions
                            </div>
                            <input
                                ref={fileInputRef}
                                type="file"
                                accept=".csv"
                                onChange={handleFileSelect}
                            />
                        </div>

                        <div className="modal-actions">
                            <button className="btn btn-secondary btn-block" onClick={onClose}>
                                Cancel
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Success Overlay
        function SuccessOverlay() {
            return (
                <div className="success-overlay">
                    <div className="success-icon">✓</div>
                    <div className="success-message">Payment Complete!</div>
                </div>
            );
        }

        // Render App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
